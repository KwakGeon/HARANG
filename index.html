<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚾ 하랑 타이거즈 상대전적</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { background: #f0f2f5; }
    .header-bar { background: #1a2e4a; color: #fff; padding: 1rem 1.5rem; border-radius: 12px; }
    .stat-card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .stat-value { font-size: 1.8rem; font-weight: 700; }
    #statsRow .text-muted { white-space: nowrap; }
    @media (max-width: 576px) {
      .stat-value { font-size: 1.25rem; }
      #statsRow .text-muted { font-size: 0.65rem !important; }
      .stat-card .card-body { padding: 0.4rem 0.15rem !important; }
      .mob-hide { display: none !important; }
    }
    .nav-tabs .nav-link { color: #555; font-weight: 500; }
    .nav-tabs .nav-link.active { color: #1a2e4a; font-weight: 700; border-bottom: 3px solid #1a2e4a; }
    .badge-win  { background: #28a745; color: #fff; }
    .badge-lose { background: #dc3545; color: #fff; }
    .badge-draw { background: #ffc107; color: #333; }
    .result-badge { padding: 3px 10px; border-radius: 20px; font-size: .8rem; font-weight: 600; }
    #loading { text-align: center; padding: 60px; color: #888; }
    th[data-sort] { cursor: pointer; user-select: none; white-space: nowrap; }
    th[data-sort]:hover { background: #293e56 !important; }
    .mvp-popover { max-width: 420px !important; }
    .mvp-popover .popover-body { padding: .75rem 1rem; }

    /* ── 모바일 하단 탭바 ── */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(26, 46, 74, 0.97);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,.13);
      z-index: 1050;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .mob-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 4px 10px;
      background: none;
      border: none;
      color: rgba(255,255,255,.45);
      cursor: pointer;
      transition: color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .mob-tab.active { color: #fff; }
    .mob-tab .mob-icon { font-size: 1.3rem; line-height: 1; }
    .mob-tab .mob-label { font-size: .6rem; font-weight: 500; letter-spacing: .02em; }
    @media (max-width: 768px) {
      .nav-tabs { display: none !important; }
      .mobile-bottom-nav { display: flex; }
      body { padding-bottom: 72px; }
    }
  </style>
</head>
<body>
<div class="container-fluid px-3 py-3" style="max-width:1200px; margin:auto">

  <!-- 헤더 -->
  <div class="header-bar d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
    <div>
      <h4 class="mb-0">⚾ 하랑 타이거즈 상대전적</h4>
      <small id="updated" class="opacity-75"></small>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <select id="filterSeason" class="form-select form-select-sm" style="width:auto; min-width:110px"></select>
      <select id="filterLeague" class="form-select form-select-sm" style="width:auto; min-width:120px"></select>
    </div>
  </div>

  <div id="loading">⏳ 데이터 불러오는 중...</div>
  <div id="app" style="display:none">

    <!-- 요약 지표 -->
    <div class="row g-2 mb-3" id="statsRow"></div>

    <!-- 탭 -->
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-tab="summary">📊 상대전적 요약</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="history">📋 경기 히스토리</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="charts">📈 차트 분석</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="mvp">🏆 MVP</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="scouting">🎯 전력분석</button></li>
    </ul>

    <div id="tabSummary"></div>
    <div id="tabHistory"  style="display:none"></div>
    <div id="tabCharts"   style="display:none"></div>
    <div id="tabMvp"      style="display:none"></div>
    <div id="tabScouting" style="display:none"></div>

  </div>
</div>

<!-- 모바일 하단 탭바 -->
<nav class="mobile-bottom-nav">
  <button class="mob-tab active" data-tab="summary"><span class="mob-icon">📊</span><span class="mob-label">전적</span></button>
  <button class="mob-tab" data-tab="history"><span class="mob-icon">📋</span><span class="mob-label">히스토리</span></button>
  <button class="mob-tab" data-tab="charts"><span class="mob-icon">📈</span><span class="mob-label">차트</span></button>
  <button class="mob-tab" data-tab="mvp"><span class="mob-icon">🏆</span><span class="mob-label">MVP</span></button>
  <button class="mob-tab" data-tab="scouting"><span class="mob-icon">🎯</span><span class="mob-label">전력분석</span></button>
</nav>

<script>
let allGames          = [];
let mvpData           = null;
let scoutingData      = null;
let scoutingByLeague  = [];
let leagueStartDates  = {};
let charts = {};
let histSort = { col: '날짜', dir: -1 };  // 기본: 날짜 내림차순

/* ── 데이터 로드 ── */
fetch('games_data.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + r.statusText);
    return r.json();
  })
  .then(data => {
    allGames          = data.games;
    mvpData           = data.mvp_stats        || null;
    scoutingData      = data.scouting         || null;
    scoutingByLeague  = data.scouting_by_league || [];
    leagueStartDates  = data.league_start_dates  || {};
    document.getElementById('updated').textContent = '마지막 업데이트: ' + data.generated_at;
    try {
      initFilters();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = '';
      render();
    } catch(e) {
      document.getElementById('loading').innerHTML =
        '<div class="alert alert-warning"><b>렌더링 오류:</b> ' + e.message + '<br><pre>' + e.stack + '</pre></div>';
    }
  })
  .catch((err) => {
    document.getElementById('loading').innerHTML =
      '<div class="alert alert-danger"><b>Fetch 오류:</b> ' + (err && err.message ? err.message : String(err)) + '</div>';
  });

/* ── 필터 초기화 ── */
function initFilters() {
  const seasons = [...new Set(allGames.map(g => g['시즌']))].sort().reverse();
  const leagues = [...new Set(allGames.map(g => g['리그']).filter(Boolean))].sort();

  const ss = document.getElementById('filterSeason');
  ss.innerHTML = '<option value="all">전체 시즌</option>' +
    seasons.map(s => `<option value="${s}">${s}시즌</option>`).join('');

  // 현재 년도를 기본값으로 설정
  const curYear = new Date().getFullYear();
  if (seasons.includes(curYear)) ss.value = String(curYear);

  const sl = document.getElementById('filterLeague');
  sl.innerHTML = '<option value="all">전체 리그</option>' +
    leagues.map(l => `<option value="${escHtml(l)}">${escHtml(l)}</option>`).join('');

  // 현재 소속 리그 자동 선택:
  // league_start_dates(리그 전체 일정 기반 개막일)가 있으면 우선 사용,
  // 없으면 allGames(우리 일정)에서 추정
  const todayMs = new Date().setHours(0, 0, 0, 0);
  const leagueFirstMs = {};
  if (Object.keys(leagueStartDates).length > 0) {
    for (const [lg, dateStr] of Object.entries(leagueStartDates)) {
      leagueFirstMs[lg] = new Date(dateStr).getTime();
    }
  } else {
    for (const g of allGames) {
      if (String(g['시즌']) !== String(curYear) || !g['리그']) continue;
      const m = g['날짜'] && g['날짜'].match(/(\d+)월(\d+)일/);
      if (!m) continue;
      const ms = new Date(curYear, parseInt(m[1]) - 1, parseInt(m[2])).getTime();
      const lg = g['리그'];
      if (leagueFirstMs[lg] === undefined || ms < leagueFirstMs[lg]) leagueFirstMs[lg] = ms;
    }
  }
  let curLeague = null, latestMs = -Infinity;
  for (const [lg, ms] of Object.entries(leagueFirstMs)) {
    if (ms <= todayMs && ms > latestMs) { latestMs = ms; curLeague = lg; }
  }
  if (curLeague) sl.value = curLeague;

  function onFilterChange() { render(); }
  ss.addEventListener('change', onFilterChange);
  sl.addEventListener('change', onFilterChange);
}

function getFiltered() {
  const season = document.getElementById('filterSeason').value;
  const league = document.getElementById('filterLeague').value;
  return allGames.filter(g =>
    (season === 'all' || String(g['시즌']) === season) &&
    (league === 'all' || g['리그'] === league)
  );
}

/* ── 전적 계산 ── */
function calcSummary(games) {
  const map = {};
  for (const g of games) {
    const k = g['상대팀'];
    if (!map[k]) map[k] = { 경기수:0, 승:0, 패:0, 무:0, 우득:0, 상득:0 };
    const t = map[k];
    t.경기수++;
    if (g['결과'].includes('승')) t.승++;
    else if (g['결과'].includes('패')) t.패++;
    else t.무++;
    t.우득 += g['우리팀_점수'] || 0;
    t.상득 += g['상대팀_점수'] || 0;
  }
  return Object.entries(map).map(([팀, v]) => ({
    팀,
    경기수: v.경기수,
    승: v.승, 패: v.패, 무: v.무,
    승률: +(v.승 / v.경기수 * 100).toFixed(1),
    평균득점: +(v.우득 / v.경기수).toFixed(2),
    평균실점: +(v.상득 / v.경기수).toFixed(2),
    득실차: v.우득 - v.상득,
  })).sort((a, b) => b.경기수 - a.경기수);
}

/* ── 전체 렌더 ── */
function render() {
  const games = getFiltered();
  renderStats(games);
  renderSummary(games);
  renderHistory(games);
  renderCharts(games);
  renderMVP();
  renderScouting();
}

/* ── 요약 지표 ── */
function renderStats(games) {
  const wins   = games.filter(g => g['결과'].includes('승')).length;
  const losses = games.filter(g => g['결과'].includes('패')).length;
  const draws  = games.filter(g => g['결과'] === '무').length;
  const rate   = games.length ? (wins / games.length * 100).toFixed(1) : 0;

  const items = [
    { label:'총 경기', value: games.length, color:'primary' },
    { label:'승',      value: wins,         color:'success' },
    { label:'패',      value: losses,       color:'danger'  },
    { label:'무',      value: draws,        color:'warning' },
    { label:'승률',    value: rate + '%',   color:'info'    },
  ];
  document.getElementById('statsRow').innerHTML = items.map(i => `
    <div class="col">
      <div class="card stat-card text-center border-${i.color} border-2">
        <div class="card-body py-2">
          <div class="stat-value text-${i.color}">${i.value}</div>
          <div class="text-muted small">${i.label}</div>
        </div>
      </div>
    </div>`).join('');
}

/* ── 상대전적 요약 탭 ── */
function renderSummary(games) {
  const summary = calcSummary(games);
  document.getElementById('tabSummary').innerHTML = `
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>상대팀</th><th class="text-center">경기수</th>
                <th class="text-center text-success">승</th>
                <th class="text-center text-danger">패</th>
                <th class="text-center text-warning">무</th>
                <th class="text-center">승률</th>
                <th class="text-center">평균득점</th>
                <th class="text-center">평균실점</th>
                <th class="text-center">득실차</th>
              </tr>
            </thead>
            <tbody>
              ${summary.map(r => {
                const rowCls = r.승률 >= 60 ? 'table-success' : r.승률 <= 40 ? 'table-danger' : '';
                const diffCls = r.득실차 >= 0 ? 'text-success' : 'text-danger';
                const sign = r.득실차 > 0 ? '+' : '';
                return `<tr class="${rowCls}">
                  <td class="fw-bold">${escHtml(r.팀)}</td>
                  <td class="text-center">${r.경기수}</td>
                  <td class="text-center fw-bold text-success">${r.승}</td>
                  <td class="text-center fw-bold text-danger">${r.패}</td>
                  <td class="text-center fw-bold">${r.무}</td>
                  <td class="text-center">${r.승률}%</td>
                  <td class="text-center">${r.평균득점}</td>
                  <td class="text-center">${r.평균실점}</td>
                  <td class="text-center fw-bold ${diffCls}">${sign}${r.득실차}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="card border-0 shadow-sm p-3">
      <canvas id="winRateChart"></canvas>
    </div>`;

  if (charts.winRate) charts.winRate.destroy();
  charts.winRate = new Chart(document.getElementById('winRateChart'), {
    type: 'bar',
    data: {
      labels: summary.map(r => r.팀),
      datasets: [{
        label: '승률(%)',
        data: summary.map(r => r.승률),
        backgroundColor: summary.map(r =>
          r.승률 >= 60 ? '#28a745' : r.승률 <= 40 ? '#dc3545' : '#ffc107'),
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: {
        legend: { display: false },
        title: { display: true, text: '상대팀별 승률 (%)', font: { size: 14 } }
      },
      scales: { x: { min: 0, max: 100, ticks: { callback: v => v + '%' } } }
    }
  });
}

/* ── 경기 히스토리 탭 ── */

// 날짜 정렬용 숫자 키 (시즌*10000 + 월*100 + 일)
function _dateKey(g) {
  const m = g['날짜'].match(/(\d+)월(\d+)일/);
  return m ? g['시즌'] * 10000 + parseInt(m[1]) * 100 + parseInt(m[2]) : 0;
}

// 결과 정렬 순서 (승 > 무 > 패)
function _resultRank(r) {
  return r.includes('승') ? 2 : r.includes('무') ? 1 : 0;
}

// 히스토리 테이블 컬럼 정의
const _HIST_COLS = [
  { key: '날짜',   label: '날짜',   cls: '' },
  { key: '시즌',   label: '시즌',   cls: 'text-center',  mobHide: true },
  { key: '상대팀', label: '상대팀', cls: '' },
  { key: '점수',   label: '점수',   cls: 'text-center' },
  { key: '득실차', label: '득실차', cls: 'text-center',  mobHide: true },
  { key: '결과',   label: '결과',   cls: 'text-center text-nowrap' },
  { key: null,     label: '리그',   cls: '',                         mobHide: true },
  { key: null,     label: '구장',   cls: '',                         mobHide: true },
  { key: null,     label: '',       cls: 'text-nowrap' },
];

// "8월11일(토) 10:00" → "08.11(토)<br>10:00" (2줄 HTML)
function _fmtDateMobile(s) {
  const m = s && s.match(/(\d+)월(\d+)일(\([가-힣]\))?\s*(\d{1,2}:\d{2})?/);
  if (!m) return escHtml(s);
  const date = String(m[1]).padStart(2,'0') + '.' + String(m[2]).padStart(2,'0') + (m[3] || '');
  const time = m[4] || '';
  return time ? `${date}<br><span class="text-muted" style="font-size:.8em">${time}</span>` : date;
}

// 리뷰 행 토글 (버튼 라벨 반응형 복원)
function _toggleReview(btn, rid) {
  const el = document.getElementById(rid);
  const isOpen = el.style.display !== 'none';
  el.style.display = isOpen ? 'none' : '';
  btn.innerHTML = isOpen
    ? '<span class="d-none d-sm-inline">📋 리뷰 보기</span><span class="d-sm-none">리뷰</span>'
    : '닫기';
}

function _histSortBy(col) {
  if (histSort.col === col) histSort.dir *= -1;
  else { histSort.col = col; histSort.dir = -1; }
  _renderHistHead();
  _renderHistBody(getFiltered(), document.getElementById('oppFilter')?.value || 'all');
}

function _renderHistHead() {
  const thead = document.getElementById('histHead');
  if (!thead) return;
  thead.innerHTML = '<tr>' + _HIST_COLS.map(c => {
    const mc = c.mobHide ? ' mob-hide' : '';
    if (!c.key) return `<th class="${c.cls}${mc}">${c.label}</th>`;
    const active = histSort.col === c.key;
    const icon = active ? (histSort.dir === 1 ? ' ↑' : ' ↓') : ' <span style="opacity:.25">↕</span>';
    return `<th class="${c.cls}${mc}" data-sort="${c.key}">${c.label}${icon}</th>`;
  }).join('') + '</tr>';
  // 헤더 클릭 이벤트 (innerHTML 교체 후 재등록)
  thead.querySelectorAll('th[data-sort]').forEach(th =>
    th.addEventListener('click', () => _histSortBy(th.dataset.sort))
  );
}

function _renderHistBody(games, opp) {
  const tbody = document.getElementById('histBody');
  if (!tbody) return;

  let rows = opp === 'all' ? [...games] : games.filter(g => g['상대팀'] === opp);
  const col = histSort.col, dir = histSort.dir;

  rows.sort((a, b) => {
    let va, vb;
    if      (col === '날짜')   { va = _dateKey(a);                          vb = _dateKey(b); }
    else if (col === '시즌')   { va = a['시즌'];                             vb = b['시즌']; }
    else if (col === '상대팀') { va = a['상대팀'];                           vb = b['상대팀']; }
    else if (col === '점수')   { va = a['우리팀_점수'] || 0;                 vb = b['우리팀_점수'] || 0; }
    else if (col === '득실차') { va = (a['우리팀_점수']||0)-(a['상대팀_점수']||0); vb = (b['우리팀_점수']||0)-(b['상대팀_점수']||0); }
    else if (col === '결과')   { va = _resultRank(a['결과']);                vb = _resultRank(b['결과']); }
    else                       { va = _dateKey(a);                          vb = _dateKey(b); }
    if (typeof va === 'string') return va.localeCompare(vb, 'ko') * dir;
    return (va - vb) * dir;
  });

  const cnt = document.getElementById('historyCount');
  if (cnt) cnt.textContent = `(${rows.length}경기)`;

  tbody.innerHTML = rows.map((g, idx) => {
    const r     = g['결과'];
    const bcls  = r.includes('승') ? 'badge-win' : r.includes('패') ? 'badge-lose' : 'badge-draw';
    const diff  = (g['우리팀_점수'] || 0) - (g['상대팀_점수'] || 0);
    const diffCls = diff > 0 ? 'text-success fw-bold' : diff < 0 ? 'text-danger fw-bold' : 'text-muted';
    const diffStr = diff > 0 ? `+${diff}` : String(diff);
    const best  = (g['best']  || []).filter(s => s !== '상세 기록 미입력');
    const worst = (g['worst'] || []).filter(s => s !== '상세 기록 미입력');
    const hasReview = best.length > 0 || worst.length > 0;
    const rid = `rev_${idx}`;

    const bestHtml  = best.map(s  => `<li>✅ ${escHtml(s)}</li>`).join('');
    const worstHtml = worst.map(s => `<li>⚠️ ${escHtml(s)}</li>`).join('');

    const reviewBtn = hasReview
      ? `<button class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="_toggleReview(this,'${rid}')">
           <span class="d-none d-sm-inline">📋 리뷰 보기</span><span class="d-sm-none">리뷰</span>
         </button>`
      : '';

    const reviewRow = hasReview ? `
      <tr id="${rid}" style="display:none">
        <td colspan="${_HIST_COLS.length}" class="p-0">
          <div class="px-3 py-2" style="background:#f8f9fa">
            <div class="row g-2">
              ${bestHtml ? `<div class="col-md-6"><div class="p-2 rounded" style="background:#f0fff4">
                <div class="fw-bold text-success mb-1 small">👍 잘한 점</div>
                <ul class="mb-0 ps-3 small">${bestHtml}</ul>
              </div></div>` : ''}
              ${worstHtml ? `<div class="col-md-6"><div class="p-2 rounded" style="background:#fff5f5">

/* ── MVP 탭 ── */
let _mvpBatterMap = {};
let _mvpPopoverListenerAdded = false;

function renderMVP() {
  const el = document.getElementById('tabMvp');
  if (!el) return;

  if (!mvpData) {
    el.innerHTML = '<div class="alert alert-secondary mt-2">MVP 통계 데이터가 없습니다.</div>';
    return;
  }

  const selectedLeague = document.getElementById('filterLeague').value;
  if (selectedLeague !== 'all') {
    // leagues 필드가 있으면 사용, 없으면 allGames의 완료 경기(game_idx 있는 것)에서 파생
    const mvpLeagues = (mvpData.leagues && mvpData.leagues.length > 0)
      ? mvpData.leagues
      : [...new Set(allGames
          .filter(g => g['game_idx'] && String(g['시즌']) === String(mvpData.season))
          .map(g => g['리그'])
          .filter(Boolean))];
    if (!mvpLeagues.includes(selectedLeague)) {
      el.innerHTML = '<div class="alert alert-secondary mt-2"><b>해당 리그는 아직 경기 전입니다.</b><br><small class="text-muted">경기가 시작되면 MVP 통계가 표시됩니다.</small></div>';
      return;
    }
  }

  const { season, total_games, batter, pitcher } = mvpData;
  const medals = ['🥇', '🥈', '🥉'];
  const 규정이닝 = total_games;
  const 규정타석 = Math.ceil(total_games * 1.5);

  // 타율 툴팁용 데이터 맵 갱신
  _mvpBatterMap = Object.fromEntries(batter.map(b => [b.name, b]));

  // 투수: 지표 기준 단순 정렬
  function sortAll(arr, key, asc) {
    return [...arr].sort((a, b) => asc ? a[key] - b[key] : b[key] - a[key]);
  }

  // 타자: 1순위=규정타석 충족, 2순위=지표
  function sortBatter(arr, key, asc) {
    return [...arr].sort((a, b) => {
      const aQ = (a['타석'] || 0) >= 규정타석;
      const bQ = (b['타석'] || 0) >= 규정타석;
      if (aQ !== bQ) return aQ ? -1 : 1;
      return asc ? a[key] - b[key] : b[key] - a[key];
    });
  }

  // 동률 처리: 같은 그룹(타자는 규정타석 충족여부 동일)에서 지표가 같으면 공동
  function assignRanks(sorted, key, isBatter) {
    const result = [];
    let rank = 1;
    for (let i = 0; i < sorted.length; ) {
      const iQ = isBatter ? (sorted[i]['타석'] || 0) >= 규정타석 : true;
      let j = i + 1;
      while (j < sorted.length && sorted[j][key] === sorted[i][key]) {
        if (isBatter && ((sorted[j]['타석'] || 0) >= 규정타석) !== iQ) break;
        j++;
      }
      const tied = (j - i) > 1;
      for (let k = i; k < j; k++) result.push({ player: sorted[k], rank, tied });
      rank += (j - i);
      i = j;
    }
    return result;
  }

  // isBatter: 규정타석 배지 표시 + 규정 우선 동률 판정
  function awardCard(title, sorted, key, unit, note, extraFn, fmtFn, showTooltip, isBatter) {
    unit = unit || '';
    const headerNote = note ? ` <small class="opacity-75 fw-normal">${note}</small>` : '';
    if (!sorted.length) {
      return `<div class="col-md-6 col-xl-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-secondary text-white fw-bold py-2">${title}${headerNote}</div>
          <div class="card-body text-muted small py-2">규정 미달 선수 없음</div>
        </div></div>`;
    }

    const ranked = assignRanks(sorted, key, isBatter);

    function makeLabel(rank, tied) {
      if (rank <= 3) {
        const m = medals[rank - 1];
        return tied
          ? `<span style="width:3.2rem;flex-shrink:0;display:inline-flex;flex-direction:column;align-items:center;line-height:1.1">
               <span style="font-size:1.05rem">${m}</span>
               <span class="text-muted" style="font-size:.58rem">공동</span>
             </span>`
          : `<span style="font-size:1.4rem;width:2.2rem;flex-shrink:0">${m}</span>`;
      }
      const label = tied ? `공동${rank}위` : `${rank}위`;
      return `<span class="text-muted" style="min-width:3rem;flex-shrink:0;font-size:.78rem;text-align:center">${label}</span>`;
    }

    function renderRow({ player: p, rank, tied }) {
      const lbl = makeLabel(rank, tied);
      const sub = extraFn ? extraFn(p) : `${p['경기']}경기`;
      const val = fmtFn   ? fmtFn(p[key]) : p[key];
      const isQ = isBatter && (p['타석'] || 0) >= 규정타석;
      const qBadge = isQ
        ? `<span class="badge bg-success ms-1" style="font-size:.55rem;vertical-align:middle;padding:1px 4px">규정</span>`
        : '';
      const info = showTooltip
        ? `<button class="mvp-avg-info btn btn-link p-0 ms-1 text-muted"
                   data-mvp-name="${escHtml(p.name)}"
                   style="font-size:.82rem;line-height:1;vertical-align:middle">ℹ️</button>`
        : '';
      return `<div class="d-flex align-items-center py-2 border-bottom">
        ${lbl}
        <div class="flex-grow-1 fw-bold ms-1">${escHtml(p.name)}${qBadge}${info}</div>
        <div class="text-end">
          <span class="badge bg-primary rounded-pill">${val}${unit}</span>
          <div class="text-muted" style="font-size:.72rem">${sub}</div>
        </div>
      </div>`;
    }

    const top  = ranked.filter(r => r.rank <= 3);
    const rest = ranked.filter(r => r.rank > 3);
    const topHtml  = top.map(r => renderRow(r)).join('');
    const restHtml = rest.length
      ? `<details>
           <summary style="cursor:pointer;list-style:none;outline:none" class="text-muted small py-2 ps-1">▼ ${rest.length}명 더 보기</summary>
           <div>${rest.map(r => renderRow(r)).join('')}</div>
         </details>`
      : '';

    return `<div class="col-md-6 col-xl-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-header bg-dark text-white fw-bold py-2">${title}${headerNote}</div>
        <div class="card-body py-2">${topHtml}${restHtml}</div>
      </div></div>`;
  }

  const fmt3   = v => (typeof v === 'number' ? v.toFixed(3) : v);
  const fmtPct = v => (typeof v === 'number' ? v.toFixed(1) : v);
  const pitExtra = p => `${p['이닝']}이닝 · ${p['경기']}경기`;

  const pitERA = sortAll(pitcher,    '방어율', true);
  const pitK   = sortAll(pitcher,    '삼진',   false);
  const batAVG = sortBatter(batter,  '타율',   false);
  const batRBI = sortBatter(batter,  '타점',   false);
  const batOPS = sortBatter(batter,  'OPS',    false);
  const batSB  = sortBatter(batter,  '도루',   false);
  const batSO  = sortBatter(batter,  '삼진',   true);
  const batATT = sortAll(batter,     '출석률', false);

  el.innerHTML = `
    <div class="alert alert-info d-flex align-items-center gap-2 mb-3 mt-1">
      <span style="font-size:1.3rem">🏆</span>
      <div>
        <strong>${season}시즌 MVP 통계</strong> &mdash; 총 ${total_games}경기 기준<br>
        <small>투수 규정이닝 ${규정이닝}이닝 이상 &nbsp;·&nbsp; 타자 규정타석 ${규정타석}타석 이상</small>
      </div>
    </div>

    <h5 class="fw-bold text-secondary mb-2">⚾ 투수 부문</h5>
    <div class="row g-3 mb-4">
      ${awardCard('방어율 (ERA)', pitERA, '방어율', '', '낮을수록 Good', pitExtra, fmt3)}
      ${awardCard('탈삼진',       pitK,   '삼진',   '개', null,          pitExtra)}
    </div>

    <h5 class="fw-bold text-secondary mb-2">🏏 타자 부문</h5>
    <div class="row g-3">
      ${awardCard('타율',      batAVG, '타율',   '',   '실책출루 포함', null, fmt3,   true,  true)}
      ${awardCard('타점',      batRBI, '타점',   '점', null,            null, null,   false, true)}
      ${awardCard('OPS',       batOPS, 'OPS',    '',   null,            null, fmt3,   false, true)}
      ${awardCard('도루',      batSB,  '도루',   '개', null,            null, null,   false, true)}
      ${awardCard('최소 삼진', batSO,  '삼진',   '개', '낮을수록 Good', null, null,   false, true)}
      ${awardCard('출석왕',    batATT, '출석률', '%',  null,            null, fmtPct, false, false)}
    </div>`;

  initMVPPopovers();
}

function renderScouting() {
  const el = document.getElementById('tabScouting');
  if (!el) return;

  // 리그 필터에 맞는 scouting 데이터 선택
  const selectedLeague = document.getElementById('filterLeague').value;
  let activeData;
  if (selectedLeague === 'all') {
    activeData = scoutingData;  // 전체: 가장 빠른 예정 경기
  } else {
    activeData = scoutingByLeague.find(s => s.league === selectedLeague) || null;
  }

  if (!activeData) {
    el.innerHTML = '<div class="alert alert-secondary mt-3"><b>다음 예정된 경기가 없습니다.</b><br><small class="text-muted">예정 경기가 등록되면 generate_data.py를 다시 실행해주세요.</small></div>';
    return;
  }

  const { opponent, game_date, priority, head_to_head_count = 0, batters = [], pitchers = [] } = activeData;

  // 이닝 문자열 "11.1" → 실수 (아웃카운트 기반)
  function parsIP(s) {
    const str = String(s || '0');
    if (str.includes('.')) {
      const [full, outs] = str.split('.');
      return parseInt(full) + parseInt(outs || '0') / 3;
    }
    return parseFloat(str) || 0;
  }

  // 투수 유형 분류
  function classifyPitcher(p) {
    const ip = parsIP(p['이닝']);
    if (ip === 0 || !p['경기']) return { label: '기록없음', color: 'secondary' };
    const k9  = p['삼진'] / ip * 9;
    const bb9 = (p['볼넷'] || 0) / ip * 9;
    if (bb9 <= 3.0 && k9 >= 5.0) return { label: '제구형', color: 'warning' };
    if (k9 >= 7.0)                return { label: '파워형', color: 'danger'  };
    if (bb9 > 4.5)                return { label: '불안형', color: 'info'    };
    return { label: '일반형', color: 'primary' };
  }

  // 팀 투수 집계
  const pitTotals = pitchers.reduce((s, p) => {
    const ip = parsIP(p['이닝']);
    s.ip  += ip;
    s.k   += p['삼진']   || 0;
    s.bb  += p['볼넷']   || 0;
    s.er  += p['자책점'] || 0;
    return s;
  }, { ip: 0, k: 0, bb: 0, er: 0 });
  const teamERA = pitTotals.ip > 0 ? (pitTotals.er / pitTotals.ip * 7).toFixed(2) : '-';
  const teamK9  = pitTotals.ip > 0 ? (pitTotals.k  / pitTotals.ip * 9).toFixed(1) : '-';

  // 팀 타자 집계
  const batTotals = batters.reduce((s, b) => {
    s.h  += b['안타'] || 0;
    s.ab += b['타수'] || 0;
    s.hr += b['홈런'] || 0;
    s.rbi += b['타점'] || 0;
    return s;
  }, { h: 0, ab: 0, hr: 0, rbi: 0 });
  const teamAVG = batTotals.ab > 0 ? (batTotals.h / batTotals.ab).toFixed(3) : '-';

  // 타자: OPS 내림차순
  const sortedBatters = [...batters].sort((a, b) => (b['OPS'] || 0) - (a['OPS'] || 0));

  // 투수 행
  const pitcherRows = pitchers.map(p => {
    const ip  = parsIP(p['이닝']);
    const k9  = ip > 0 ? (p['삼진'] / ip * 9).toFixed(1)           : '-';
    const bb9 = ip > 0 ? ((p['볼넷'] || 0) / ip * 9).toFixed(1)    : '-';
    const cls = classifyPitcher(p);
    const era = (p['방어율'] || 0);
    const eraCls = era <= 3.0 ? 'text-danger fw-bold' : era >= 6.0 ? 'text-muted' : '';
    return `<tr>
      <td class="fw-bold">${escHtml(p['name'])}</td>
      <td class="text-center">${p['경기']}</td>
      <td class="text-center">${p['이닝']}</td>
      <td class="text-center ${eraCls}">${era.toFixed(2)}</td>
      <td class="text-center">${p['삼진']}</td>
      <td class="text-center">${p['볼넷'] !== undefined ? p['볼넷'] : '-'}</td>
      <td class="text-center">${k9}</td>
      <td class="text-center">${bb9}</td>
      <td class="text-center"><span class="badge bg-${cls.color}">${cls.label}</span></td>
    </tr>`;
  }).join('');

  // 타자 행
  const batterRows = sortedBatters.map((b, i) => {
    const threat = i < 3
      ? '<span class="badge bg-danger ms-1" style="font-size:.65rem">주의</span>'
      : i < 6
        ? '<span class="badge bg-warning text-dark ms-1" style="font-size:.65rem">경계</span>'
        : '';
    const rowCls = i < 3 ? 'table-danger' : i < 6 ? 'table-warning' : '';
    return `<tr class="${rowCls}">
      <td class="fw-bold">${escHtml(b['name'])}${threat}</td>
      <td class="text-center">${b['경기']}</td>
      <td class="text-center">${b['타수'] || 0}</td>
      <td class="text-center">${b['안타'] || 0}</td>
      <td class="text-center">${(b['정규타율'] || 0).toFixed(3)}</td>
      <td class="text-center">${b['타점']}</td>
      <td class="text-center">${b['홈런']}</td>
      <td class="text-center">${b['볼넷'] || 0}</td>
      <td class="text-center">${b['삼진'] || 0}</td>
      <td class="text-center">${(b['OBP'] || 0).toFixed(3)}</td>
      <td class="text-center">${(b['SLG'] || 0).toFixed(3)}</td>
      <td class="text-center fw-bold">${(b['OPS'] || 0).toFixed(3)}</td>
    </tr>`;
  }).join('');

  const priorityBadge = priority === 'head_to_head'
    ? `<span class="badge bg-success ms-2">우리 전적 기준 (${head_to_head_count}경기)</span>`
    : priority === 'current_league'
      ? `<span class="badge bg-primary ms-2">소속 리그 기준</span>`
      : `<span class="badge bg-secondary ms-2">예정 리그 기준</span>`;

  el.innerHTML = `
    <div class="alert alert-primary d-flex align-items-center gap-3 mb-3 mt-1">
      <span style="font-size:1.8rem">🎯</span>
      <div>
        <div class="fw-bold fs-6">${escHtml(opponent)}${priorityBadge}</div>
        <small class="opacity-75">다음 경기: ${escHtml(game_date)}</small>
      </div>
    </div>

    <div class="row g-2 mb-4">
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm text-center py-2 px-1">
          <div class="fw-bold fs-5 text-danger">${teamERA}</div>
          <div class="text-muted" style="font-size:.78rem">팀 방어율</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm text-center py-2 px-1">
          <div class="fw-bold fs-5 text-primary">${teamK9}</div>
          <div class="text-muted" style="font-size:.78rem">K/9 (삼진/9이닝)</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm text-center py-2 px-1">
          <div class="fw-bold fs-5 text-success">${teamAVG}</div>
          <div class="text-muted" style="font-size:.78rem">팀 타율</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm text-center py-2 px-1">
          <div class="fw-bold fs-5 text-warning">${batTotals.hr}</div>
          <div class="text-muted" style="font-size:.78rem">팀 홈런</div>
        </div>
      </div>
    </div>

    <h5 class="fw-bold text-secondary mb-2">⚾ 투수 분석</h5>
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-header bg-dark text-white py-2 d-flex flex-wrap justify-content-between align-items-center gap-2">
        <span class="small fw-bold">투수 유형 분류 기준</span>
        <div class="d-flex gap-1 flex-wrap" style="font-size:.72rem">
          <span class="badge bg-warning text-dark">제구형 = 볼넷율≤3.0 &amp; 삼진율≥5.0</span>
          <span class="badge bg-danger">파워형 = 삼진율≥7.0</span>
          <span class="badge bg-info text-dark">불안형 = 볼넷율&gt;4.5</span>
          <span class="badge bg-primary">일반형</span>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle mb-0">
            <thead class="table-secondary">
              <tr>
                <th>선수</th>
                <th class="text-center">경기</th>
                <th class="text-center">이닝</th>
                <th class="text-center">방어율</th>
                <th class="text-center">삼진</th>
                <th class="text-center">볼넷</th>
                <th class="text-center">삼진율</th>
                <th class="text-center">볼넷율</th>
                <th class="text-center">유형</th>
              </tr>
            </thead>
            <tbody>
              ${pitcherRows || '<tr><td colspan="9" class="text-center text-muted py-3">투수 데이터 없음</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <h5 class="fw-bold text-secondary mb-2">🏏 주의 타자 리스트</h5>
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-dark text-white py-2 d-flex flex-wrap justify-content-between align-items-center gap-2">
        <span class="small fw-bold">OPS 기준 내림차순 정렬</span>
        <div class="d-flex gap-1 flex-wrap" style="font-size:.72rem">
          <span class="badge bg-danger">주의 = 1~3위</span>
          <span class="badge bg-warning text-dark">경계 = 4~6위</span>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle mb-0">
            <thead class="table-secondary">
              <tr>
                <th>선수</th>
                <th class="text-center">경기</th>
                <th class="text-center">타수</th>
                <th class="text-center">안타</th>
                <th class="text-center">타율</th>
                <th class="text-center">타점</th>
                <th class="text-center">홈런</th>
                <th class="text-center">볼넷</th>
                <th class="text-center">삼진</th>
                <th class="text-center">출루율</th>
                <th class="text-center">장타율</th>
                <th class="text-center">OPS</th>
              </tr>
            </thead>
            <tbody>
              ${batterRows || '<tr><td colspan="12" class="text-center text-muted py-3">타자 데이터 없음</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

function initMVPPopovers() {
  if (typeof bootstrap === 'undefined') return;

  document.querySelectorAll('.mvp-avg-info').forEach(btn => {
    const old = bootstrap.Popover.getInstance(btn);
    if (old) old.dispose();

    const name = btn.getAttribute('data-mvp-name');
    const p = _mvpBatterMap[name];
    if (!p) return;

    const reg     = (p['정규타율'] || 0).toFixed(3);
    const withErr = (p['타율']     || 0).toFixed(3);
    const records = p['실책_기록'] || [];

    let content = `<div style="min-width:360px">
      <div class="d-flex gap-4 mb-2">
        <div><span class="text-muted small">정규타율</span><br><span class="fw-bold fs-6">${reg}</span></div>
        <div><span class="text-muted small">실책·R·낫아웃 포함</span><br><span class="fw-bold fs-6 text-primary">${withErr}</span></div>
      </div>`;

    if (records.length) {
      const totalReach = records.reduce((s, r) => s + (r['플레이'] || []).length, 0);
      content += `<hr class="my-1"><div class="small fw-bold mb-1">비히트 출루 기록 <span class="text-secondary fw-normal">(${totalReach}건)</span></div>`;
      records.forEach(r => {
        const plays = (r['플레이'] || []).map(escHtml).join(' · ');
        content += `<div class="d-flex align-items-baseline gap-2 small mb-1">
          <span class="text-nowrap text-muted">${escHtml(r['날짜'])}</span>
          <span class="fw-bold text-nowrap">vs ${escHtml(r['상대팀'])}</span>
          <span class="text-muted">${plays}</span>
        </div>`;
      });
    } else {
      content += `<div class="small text-muted mt-1">비히트 출루 없음</div>`;
    }
    content += `</div>`;

    new bootstrap.Popover(btn, {
      html: true,
      content: content,
      trigger: 'click',
      placement: 'auto',
      sanitize: false,
      customClass: 'mvp-popover',
    });
  });

  if (!_mvpPopoverListenerAdded) {
    _mvpPopoverListenerAdded = true;
    document.addEventListener('click', e => {
      if (!e.target.closest('.mvp-avg-info') && !e.target.closest('.mvp-popover')) {
        document.querySelectorAll('.mvp-avg-info').forEach(btn => {
          const inst = bootstrap.Popover.getInstance(btn);
          if (inst) inst.hide();
        });
      }
    }, true);  // capture phase로 등록해 다른 이벤트보다 먼저 처리
  }
}

/* ── XSS 방지 ── */
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
